name: Pages preview verification (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'chameleonjp-lab/100masu_yusha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: fc7fad2a8f706d92279f2b3d63cefbdbdc76674d
      TREE_SHA: 3048dcd0dcc75a0975a78a877ae5838850c26f46
      COMMIT_PIN: 1be06b0442ed862ce082235f040ef31646dc939ad1e978e620995aa6473a88f9
      TREE_PIN: a856d08a2b44dbb9d4d9adbffa01d140296efc00208af6f21f3a0f3e32dbc7be
      MANIFEST_PIN: aea273400006f460b5ab833156c009bf8cc28d33e68dc413f0bdb8dd6690a9d4
    steps:
      - name: Checkout main history for ancestry verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Prepare fixed, offline-verifiable preview
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$TREE_SHA"
          work=$(mktemp -d "$RUNNER_TEMP/yusha-pages-verify.XXXXXX")
          printf 'YUSHA_VERIFY_ROOT=%s\n' "$work" >> "$GITHUB_ENV"
          mkdir "$work/source" "$work/helpers" "$work/home"
          git archive --format=tar "$SOURCE_SHA" | tar -xf - -C "$work/source"
          git archive --format=tar "$SOURCE_SHA" | tar -xf - -C "$work/helpers"

          # Public fixed GitHub metadata only; no application endpoints, token, or redirect.
          api=https://api.github.com/repos/chameleonjp-lab/100masu_yusha/git
          for pair in "commit:$api/commits/$SOURCE_SHA" "tree:$api/trees/$TREE_SHA?recursive=1"; do
            name=${pair%%:*}
            url=${pair#*:}
            status=$(curl --disable --silent --show-error --fail --proto '=https' --max-time 30 \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$work/$name.raw.json" --write-out '%{http_code}' "$url")
            test "$status" = 200
          done

          cd "$work"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { buildPages } from './helpers/tools/build-pages.mjs';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const { SOURCE_SHA, TREE_SHA, COMMIT_PIN, TREE_PIN, MANIFEST_PIN } = process.env;
          const metadata = {};
          for (const [name, pin] of [['commit', COMMIT_PIN], ['tree', TREE_PIN]]) {
            const object = JSON.parse(fs.readFileSync(name + '.raw.json', 'utf8'));
            const bytes = Buffer.from(JSON.stringify(object));
            assert.equal(hash(bytes), pin, name + ' metadata differs from reviewed bytes');
            fs.writeFileSync(name + '.compact.json', bytes, { flag: 'wx' });
            metadata[name] = object;
          }
          assert.equal(metadata.commit.sha, SOURCE_SHA);
          assert.equal(metadata.commit.tree.sha, TREE_SHA);
          assert.equal(metadata.tree.sha, TREE_SHA);
          assert.equal(metadata.tree.truncated, false);
          const result = buildPages({source: 'source', expectedTree: metadata.tree,
            commit: metadata.commit, sourceSha: SOURCE_SHA, out: 'preview'});
          assert.ok(result.ok, JSON.stringify(result.diagnostics));
          assert.equal(result.artifact.manifestSha256, MANIFEST_PIN);
          assert.equal(result.artifact.files, 265);
          assert.equal(result.publicationReady, false);
          console.log('Fixed preview reproduced: 265 files. Browser not yet checked.');
          NODE
      - name: Run existing guarded browser probes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$YUSHA_VERIFY_ROOT"
          node_bin=$(command -v node)
          browser=$(command -v google-chrome || command -v chromium || true)
          if test -z "$browser"; then
            echo '::error::Guarded native verification blocked: the runner has no existing Chromium. No browser installed.'
            exit 1
          fi
          global_root=$(npm root -g)
          module=
          for candidate in "$global_root/playwright-core" "$global_root/playwright/node_modules/playwright-core"; do
            if test -f "$candidate/index.js" &&
              grep -Eq 'routeWebSocket\(' "$candidate/types/types.d.ts" 2>/dev/null; then
              module="$candidate"
              break
            fi
          done
          if test -z "$module"; then
            # Install nothing: fetch one integrity-pinned npm tarball, with no
            # credentials or redirect, then expose only its temporary module.
            fetch_dir=$(mktemp -d "$YUSHA_VERIFY_ROOT/playwright-core.XXXXXX")
            archive="$fetch_dir/playwright-core.tgz"
            status=$(curl --disable --silent --show-error --fail --proto '=https' \
              --max-time 45 --max-filesize 8388608 --output "$archive" --write-out '%{http_code}' \
              'https://registry.npmjs.org/playwright-core/-/playwright-core-1.62.1.tgz')
            test "$status" = 200
            python3 - "$archive" "$fetch_dir" <<'PYTHON'
          import base64, hashlib, hmac, io, json, pathlib, shutil, sys, tarfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2])
          with archive.open('rb') as stream:
              payload = stream.read(8388609)
          if not (0 < len(payload) <= 8388608):
              raise SystemExit('playwright-core archive byte limit exceeded')
          pinned = 'wPYSwEBJY9GHraISXqyqtx0na0LpO3XEX7jNDhntbex7tzUS7kLnZsOlFruFJB4Hi/rhDMjXGqHewDZ68nYZVw=='
          if not hmac.compare_digest(base64.b64encode(hashlib.sha512(payload).digest()).decode(), pinned):
              raise SystemExit('playwright-core archive integrity mismatch')

          seen, total = set(), 0
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as package:
              for member in package:
                  parts = member.name.split('/')
                  if (parts[0] != 'package' or any(part in ('', '.', '..') or '\\' in part for part in parts)
                      or member.name in seen or not (member.isdir() or member.isfile())
                      or len(seen) >= 3000 or getattr(member, 'sparse', None)):
                      raise SystemExit('unsafe playwright-core archive entry')
                  seen.add(member.name)
                  target = root.joinpath(*parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  total += member.size
                  if total > 33554432:
                      raise SystemExit('playwright-core extraction limit exceeded')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with package.extractfile(member) as data, target.open('xb') as out:
                      shutil.copyfileobj(data, out)
          metadata = json.loads((root / 'package/package.json').read_text(encoding='utf-8'))
          if metadata.get('name') != 'playwright-core' or metadata.get('version') != '1.62.1':
              raise SystemExit('unexpected playwright-core package identity')
          PYTHON
            module="$fetch_dir/package"
            test -f "$module/index.js"
            grep -Eq 'routeWebSocket\(' "$module/types/types.d.ts"
          fi
          export YUSHA_BROWSER="$browser" YUSHA_PLAYWRIGHT="$module"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.cwd();
          const { SOURCE_SHA, TREE_SHA, COMMIT_PIN, TREE_PIN, MANIFEST_PIN,
            YUSHA_BROWSER, YUSHA_PLAYWRIGHT } = process.env;
          const helperPins = {
            'cli.mjs': 'c2b482e11ab26361c32407a3dfdc4c60a2a8b1a3e12d4af33ff4ffbaf3923670',
            'pins.mjs': '6ebf90c23503b0e48b6ae6ac8da0cdf87dd955388033d5f8dda61f55c97ac825',
            'loader.mjs': '6c817a30931299c0fcc583b1399c05b585fc57b568414a567257844aa6e3bd7c',
            'helpers.mjs': 'b8e6cb1d904f6483072a90c39c65c6243dc446ce8d49604abaaaaf82c37d81f8',
            'providers.mjs': 'bea92e1af2c3c60fc8e2d4ea1a3a90dd20cba0d8ef4dfefe39a746f31ec27072',
            'wiring.mjs': '689c175a6ef2c66d4e23a55389a2921924d3a6003c88299f36011603d68d67d9',
            'combined-gates.mjs': '6380834c0127890fd17dbdc996e9b9c83610a1bf1227ce1660f6c951568df512',
            './battle-probe.mjs': '2372664f0c7f4a672f7f41c55dcb507f5716c2487ed266da23fa1ee753ff60c4',
          };
          const config = {
            sourceRoot: path.join(root, 'source'),
            artifact: path.join(root, 'preview'),
            gameCommit: SOURCE_SHA, treeSha: TREE_SHA, manifestPin: MANIFEST_PIN,
            commitMetadata: path.join(root, 'commit.compact.json'), commitMetadataSha256: COMMIT_PIN,
            treeMetadata: path.join(root, 'tree.compact.json'), treeMetadataSha256: TREE_PIN,
            helperPins, chromiumPath: YUSHA_BROWSER, playwrightModule: YUSHA_PLAYWRIGHT,
            baseURLs: ['http://127.0.0.1:41973/', 'http://127.0.0.1:41974/100masu_yusha/'],
          };
          fs.writeFileSync('config.json', JSON.stringify(config), { flag: 'wx' });
          NODE
          # Observe the existing test once, from the same browser process.
          # Discard all raw stdout/stderr; emit only fixed diagnostic codes.
          env -i PATH="$PATH" HOME="$YUSHA_VERIFY_ROOT/home" LANG=C.UTF-8 \
            DEBUG=pw:browser,pw:api DEBUG_COLORS=0 \
            python3 - "$node_bin" helpers/tests/browser/pub10/cli.mjs --run-permitted config.json <<'SAFE_DIAGNOSTIC'
          import json
          import re
          import subprocess
          import sys
          import threading

          SOURCE = 'fc7fad2a8f706d92279f2b3d63cefbdbdc76674d'
          TREE = '3048dcd0dcc75a0975a78a877ae5838850c26f46'
          MANIFEST = 'aea273400006f460b5ab833156c009bf8cc28d33e68dc413f0bdb8dd6690a9d4'
          MOUNTS = ('root', 'subpath')
          BASES = ('http://127.0.0.1:41973/', 'http://127.0.0.1:41974/100masu_yusha/')
          PREFIX = rb'^(?:\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z )?'
          API_RE = re.compile(PREFIX + rb'pw:api (?:=>|<=) ([a-zA-Z0-9.]+) (started|succeeded|failed)\r?\n$')
          BROWSER_RE = re.compile(PREFIX + rb'pw:browser <(launching|launched)> ')
          STAGES = {
              b'browsertype.launch': 'launch',
              b'chromium.launch': 'launch',
              b'browser.newcontext': 'context',
              b'browsercontext.newpage': 'page',
              b'page.goto': 'navigate',
              b'page.evaluate': 'evaluate',
              b'locator.waitfor': 'wait-ui',
              b'locator.click': 'interact',
              b'locator.press': 'interact',
              b'locator.fill': 'interact',
              b'page.reload': 'reload',
          }

          def observation():
              output = bytearray()
              output_invalid = []
              saw_attempt = saw_spawn = saw_launch_ok = False
              last_forward_api = last_failed_api = None
              with subprocess.Popen(sys.argv[1:], stdout=subprocess.PIPE, stderr=subprocess.PIPE) as child:
                  def drain_stdout():
                      try:
                          for chunk in iter(lambda: child.stdout.read(8192), b''):
                              if len(output) + len(chunk) <= 2097152 and not output_invalid:
                                  output.extend(chunk)
                              elif not output_invalid:
                                  output_invalid.append(True)
                      except Exception:
                          output_invalid.append(True)
                  thread = threading.Thread(target=drain_stdout)
                  thread.start()
                  truncated_line = False
                  try:
                      for line in iter(lambda: child.stderr.readline(8193), b''):
                          if not line.endswith(b'\n'):
                              truncated_line = True
                              continue
                          if truncated_line or len(line) > 8192:
                              truncated_line = False
                              continue
                          browser = BROWSER_RE.match(line)
                          if browser:
                              saw_attempt |= browser[1] == b'launching'
                              saw_spawn |= browser[1] == b'launched'
                          m = API_RE.match(line)
                          stage = STAGES.get(m[1].lower()) if m else None
                          if stage:
                              status = m[2].decode('ascii')
                              last_forward_api = [stage, status]
                              if status == 'failed':
                                  last_failed_api = stage
                              saw_launch_ok |= stage == 'launch' and status == 'succeeded'
                  finally:
                      thread.join()
                  code = child.wait()

              if output_invalid:
                  raise ValueError('diagnostic output invalid')
              record = json.loads(output)
              outcomes = record.get('results')
              if not isinstance(outcomes, list) or len(outcomes) > len(MOUNTS):
                  outcomes = []
              matched = []
              gates = []
              for index, mount in enumerate(MOUNTS):
                  result = outcomes[index] if index < len(outcomes) else None
                  identity = result.get('identity') if isinstance(result, dict) else None
                  matched.append(identity == dict(gameCommit=SOURCE, treeSha=TREE, manifestPin=MANIFEST, baseURL=BASES[index]))
                  group = result.get('gates', {}) if isinstance(result, dict) else {}
                  summary = {'mount': mount}
                  for gate in ('unseeded', 'seeded'):
                      state = group.get(gate)
                      if state is None:
                          safe = 'not-run'
                      elif state.get('status') == 'passed':
                          safe = 'passed'
                      elif state.get('status') == 'failed' and state.get('code') == 'GATE_REJECTED':
                          safe = 'gate-rejected'
                      else:
                          safe = 'unclassified'
                      summary[gate] = safe
                  gates.append(summary)
              if code == 0:
                  if (record.get('status') != 'passed' or record.get('browserAcceptance') is not False
                          or record.get('deployment') is not False or not all(matched)
                          or any(item[g] != 'passed' for item in gates for g in ('unseeded', 'seeded'))):
                      raise ValueError('passing test did not produce fixed evidence')
                  status = 'passed'
              elif record.get('code') == 'CLI_PREFLIGHT_OR_EXECUTION_BLOCKED':
                  status = 'preflight-or-execution-blocked'
              elif record.get('status') == 'failed':
                  status = 'gate-failed'
              else:
                  status = 'unclassified-failure'
              receipt = {'status': status, 'source_sha': SOURCE, 'manifest_sha256': MANIFEST,
                         'launch_attempt': saw_attempt, 'spawn_observed': saw_spawn,
                         'launch_completed': saw_launch_ok, 'last_forward_api': last_forward_api,
                         'last_failed_api': last_failed_api, 'returned_identity_matches': matched, 'gates': gates}
              print(json.dumps(receipt, separators=(',', ':')))
              return 0 if code == 0 else 1

          try:
              result = observation()
          except Exception:
              print('{"status":"diagnostic-filter-failed"}')
              result = 1
          sys.exit(result)
          SAFE_DIAGNOSTIC
          echo 'Existing PUB-10 browser probes passed; independent Q3 review and deployment are not part of this job.'
